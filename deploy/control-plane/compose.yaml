services:
  control-plane:
    image: ghcr.io/whitesmith/control-plane:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATA_ROOT: /var/lib/whitesmith
    healthcheck:
      test: ["CMD", "bun", "-e", "const response=await fetch('http://localhost:3000/api/readyz');process.exit(response.ok?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
    volumes: [whitesmith-data:/var/lib/whitesmith]
    ports: ["127.0.0.1:3000:3000"]
volumes:
  whitesmith-data:
