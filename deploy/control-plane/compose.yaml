# The image owns the immutable worker manifest URL and contract version.
# Operators configure only the external database and public/worker origins.
services:
  control-plane:
    image: ${MARS_CONTROL_PLANE_IMAGE:?set MARS_CONTROL_PLANE_IMAGE to a v<semver> tag or repository@sha256 digest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATA_ROOT: /var/lib/mars
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      GITHUB_WEBHOOK_URL: ${GITHUB_WEBHOOK_URL:?set GITHUB_WEBHOOK_URL}
      WORKER_BASE_URL: ${WORKER_BASE_URL:-}
    healthcheck:
      test: ["CMD", "bun", "-e", "const response=await fetch('http://127.0.0.1:3000/api/readyz');process.exit(response.ok?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
    volumes: [mars-data:/var/lib/mars]
    ports: ["127.0.0.1:3000:3000"]

  cloudflared:
    image: cloudflare/cloudflared:2025.7.0
    profiles: [tunnel]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["test -n \"$$TUNNEL_TOKEN\" || { echo 'CLOUDFLARE_TUNNEL_TOKEN is required' >&2; exit 1; }; exec cloudflared tunnel --no-autoupdate run --token \"$$TUNNEL_TOKEN\""]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      control-plane:
        condition: service_healthy
volumes:
  mars-data:
