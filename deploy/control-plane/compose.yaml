services:
  control-plane:
    image: ghcr.io/snazzie/mars/control-plane:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATA_ROOT: /var/lib/mars
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      WORKER_BASE_URL: ${WORKER_BASE_URL:-}
    healthcheck:
      test: ["CMD", "bun", "-e", "const response=await fetch('http://localhost:3000/api/readyz');process.exit(response.ok?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
    volumes: [mars-data:/var/lib/mars]
    ports: ["127.0.0.1:3000:3000"]

  cloudflared:
    image: cloudflare/cloudflared:2025.7.0
    profiles: [tunnel]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["test -n \"$$TUNNEL_TOKEN\" || { echo 'CLOUDFLARE_TUNNEL_TOKEN is required' >&2; exit 1; }; exec cloudflared tunnel --no-autoupdate run --token \"$$TUNNEL_TOKEN\""]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      control-plane:
        condition: service_healthy
volumes:
  mars-data:
