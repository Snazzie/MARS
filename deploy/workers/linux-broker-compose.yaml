services:
  linux-broker:
    image: ${MARS_BROKER_IMAGE:?digest-pinned broker image required}
    restart: unless-stopped
    user: "10001:10001"
    group_add:
      - "${LIBVIRT_SOCKET_GID:?libvirt socket gid required}"
    environment:
      MARS_CONTROL_PLANE_URL: ${MARS_CONTROL_PLANE_URL}
      MARS_JOIN_CODE_FILE: /var/lib/mars/config/join-code
      MARS_GOLDEN_DISK: /var/lib/mars/golden/worker.qcow2
      MARS_GOLDEN_DIGEST: ${MARS_GOLDEN_DIGEST}
      MARS_DOMAIN_TEMPLATE: /etc/mars/worker-domain.xml
      MARS_CLONE_ROOT: /var/lib/mars/clones
      MARS_CHANNEL_ROOT: /var/lib/mars/channels
      MARS_LIBVIRT_NETWORK: ${MARS_LIBVIRT_NETWORK}
      MARS_ACTION_CACHE_ROOT: ${MARS_ACTION_CACHE_ROOT:-/var/lib/mars/action-cache}
      MARS_CACHE_PROXY_PORT: ${MARS_CACHE_PROXY_PORT:-8788}
      MARS_CACHE_DATA_PORT: ${MARS_CACHE_DATA_PORT:-8789}
      MARS_CACHE_PROXY_URL: ${MARS_CACHE_PROXY_URL:-}
      MARS_CACHE_ADVERTISE_URL: ${MARS_CACHE_ADVERTISE_URL:-}
      MARS_CACHE_TOKEN_ISSUER: ${MARS_CACHE_TOKEN_ISSUER:-}
      MARS_CACHE_JWKS_URL: ${MARS_CACHE_JWKS_URL:-}
    ports:
      - "${MARS_CACHE_PROXY_PORT:-8788}:${MARS_CACHE_PROXY_PORT:-8788}"
      - "${MARS_CACHE_DATA_PORT:-8789}:${MARS_CACHE_DATA_PORT:-8789}"
    volumes:
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
      - ${MARS_BROKER_CONFIG:?config directory required}:/var/lib/mars/config
      - ${MARS_GOLDEN_ROOT:?golden directory required}:/var/lib/mars/golden:ro
      - ${MARS_CLONE_ROOT:?clone directory required}:/var/lib/mars/clones
      - ${MARS_CHANNEL_ROOT:?channel directory required}:/var/lib/mars/channels
      - action-cache:${MARS_ACTION_CACHE_ROOT:-/var/lib/mars/action-cache}
      - ${MARS_DOMAIN_TEMPLATE:?domain template required}:/etc/mars/worker-domain.xml:ro

volumes:
  action-cache:
