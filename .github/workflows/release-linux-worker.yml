name: Release Linux worker
on:
  workflow_dispatch:
  push:
    tags: ['linux-worker-*']
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.20'
      - run: bun install --frozen-lockfile
      - run: |
          mkdir -p dist
          bun build apps/job-agent/src/index.ts --compile --outfile dist/mars-job-agent
          bun build apps/orchestrator/src/index.ts --compile --outfile dist/mars-orchestrator
      - name: Build and publish Linux broker image
        env:
          IMAGE: ghcr.io/snazzie/mars/linux-broker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f deploy/workers/linux-broker.Dockerfile -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"
      - run: bash images/worker-appliance/build.sh mars-worker
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          UBUNTU_QCOW2_URL: ${{ vars.UBUNTU_QCOW2_URL }}
          UBUNTU_QCOW2_SHA256: ${{ vars.UBUNTU_QCOW2_SHA256 }}
          RUNNER_ARCHIVE_URL: ${{ vars.RUNNER_ARCHIVE_URL }}
          RUNNER_ARCHIVE_SHA256: ${{ vars.RUNNER_ARCHIVE_SHA256 }}
          JOB_AGENT_BINARY: dist/mars-job-agent
      - name: Write worker release metadata
        run: |
          CONTRACT_VERSION="$(node -p "require('./packages/contracts/package.json').version")"
          jq -n \
            --arg contractVersion "$CONTRACT_VERSION" \
            --arg buildId "${{ github.sha }}" \
            '{schemaVersion: 1, product: "Mars", worker: "linux-x64", contractVersion: $contractVersion, buildId: $buildId}' \
            > images/worker-appliance/dist/mars-linux-worker-release.json
      - name: Package Linux worker release
        run: tar -czf "images/worker-appliance/dist/mars-linux-worker-${{ github.sha }}.tar.gz" -C images/worker-appliance/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: mars-linux-worker-${{ github.sha }}
          path: images/worker-appliance/dist
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" images/worker-appliance/dist/* --generate-notes
