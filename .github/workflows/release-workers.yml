name: Release workers

on:
  workflow_dispatch:
  push:
    tags: ['worker-*']

permissions:
  contents: write
  packages: write
  id-token: write

env:
  BUILD_ID: ${{ github.sha }}
  CONTRACT_VERSION: 0.1.0

jobs:
  linux:
    name: Build Linux x64 worker
    runs-on: ubuntu-24.04
    outputs:
      metadata: ${{ steps.metadata.outputs.json }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - name: Build Linux worker binaries
        run: |
          bun install --frozen-lockfile
          mkdir -p dist/linux
          bun build apps/orchestrator/src/index.ts --compile --target=bun-linux-x64 --outfile=dist/linux/mars-orchestrator
          bun build apps/job-agent/src/index.ts --compile --target=bun-linux-x64 --outfile=dist/linux/mars-job-agent
          cp deploy/workers/install-worker.sh deploy/workers/linux-broker-compose.yaml deploy/workers/worker-domain.xml dist/linux/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Acquire and validate Linux release artifacts
        env:
          GOLDEN_IMAGE_SOURCE_URL: ${{ vars.MARS_LINUX_GOLDEN_IMAGE_SOURCE_URL }}
          GOLDEN_IMAGE_URL: ${{ vars.MARS_LINUX_GOLDEN_IMAGE_URL }}
          GOLDEN_IMAGE_SHA256: ${{ vars.MARS_LINUX_GOLDEN_IMAGE_SHA256 }}
          GOLDEN_COSIGN_BUNDLE_URL: ${{ vars.MARS_LINUX_GOLDEN_COSIGN_BUNDLE_URL }}
        run: |
          set -euo pipefail
          test -n "$GOLDEN_IMAGE_SOURCE_URL" -a -n "$GOLDEN_IMAGE_URL" -a -n "$GOLDEN_IMAGE_SHA256" -a -n "$GOLDEN_COSIGN_BUNDLE_URL"
          case "$GOLDEN_IMAGE_SOURCE_URL" in https://*) ;; *) echo "golden image source URL must use HTTPS" >&2; exit 1 ;; esac
          case "$GOLDEN_IMAGE_URL" in https://*) ;; *) echo "golden image URL must use HTTPS" >&2; exit 1 ;; esac
          case "$GOLDEN_COSIGN_BUNDLE_URL" in https://*) ;; *) echo "golden cosign bundle URL must use HTTPS" >&2; exit 1 ;; esac
          [[ "$GOLDEN_IMAGE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "golden image SHA-256 is invalid" >&2; exit 1; }
          GOLDEN_IMAGE_PATH=dist/linux/mars-worker-golden.qcow2
          curl --fail --location --retry 3 --proto "=https" --tlsv1.2 "$GOLDEN_IMAGE_SOURCE_URL" --output "$GOLDEN_IMAGE_PATH"
          test -s "$GOLDEN_IMAGE_PATH"
          actualGoldenSha256="$(sha256sum "$GOLDEN_IMAGE_PATH" | cut -d' ' -f1)"
          test "$actualGoldenSha256" = "$GOLDEN_IMAGE_SHA256"
          cosign sign-blob --yes --bundle dist/linux/mars-worker-golden.qcow2.bundle "$GOLDEN_IMAGE_PATH"
          test -s dist/linux/mars-worker-golden.qcow2.bundle
      - name: Publish digest-pinned Linux broker image
        env:
          BROKER_REPOSITORY: ${{ vars.MARS_LINUX_BROKER_REPOSITORY }}
        run: |
          set -euo pipefail
          test -n "$BROKER_REPOSITORY"
          docker buildx build --push -f deploy/workers/linux-broker.Dockerfile -t "$BROKER_REPOSITORY:$BUILD_ID" .
          brokerDigest="$(docker buildx imagetools inspect "$BROKER_REPOSITORY:$BUILD_ID" --format '{{.Manifest.Digest}}')"
          case "$brokerDigest" in sha256:[0-9a-fA-F][0-9a-fA-F]*) ;; *) echo "broker image digest missing" >&2; exit 1 ;; esac
          cosign sign --yes "$BROKER_REPOSITORY@$brokerDigest"
          echo "BROKER_IMAGE=$BROKER_REPOSITORY@$brokerDigest" >> "$GITHUB_ENV"
      - name: Write Linux release metadata
        env:
          GOLDEN_IMAGE_URL: ${{ vars.MARS_LINUX_GOLDEN_IMAGE_URL }}
          GOLDEN_IMAGE_SHA256: ${{ vars.MARS_LINUX_GOLDEN_IMAGE_SHA256 }}
          GOLDEN_COSIGN_BUNDLE_URL: ${{ vars.MARS_LINUX_GOLDEN_COSIGN_BUNDLE_URL }}
        id: metadata
        run: |
          set -euo pipefail
          test -n "$GOLDEN_IMAGE_URL" -a -n "$GOLDEN_IMAGE_SHA256" -a -n "$GOLDEN_COSIGN_BUNDLE_URL" -a -n "$BROKER_IMAGE"
          [[ "$GOLDEN_IMAGE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "golden image SHA-256 is invalid" >&2; exit 1; }
          [[ "$BROKER_IMAGE" =~ ^.+@sha256:[0-9a-f]{64}$ ]] || { echo "broker image must be digest-pinned" >&2; exit 1; }
          sha256sum dist/linux/mars-orchestrator | cut -d' ' -f1 > dist/linux/orchestrator.sha256
          sha256sum dist/linux/linux-broker-compose.yaml | cut -d' ' -f1 > dist/linux/compose.sha256
          sha256sum dist/linux/worker-domain.xml | cut -d' ' -f1 > dist/linux/domain.sha256
          jq -cn --arg orchestratorSha256 "$(cat dist/linux/orchestrator.sha256)" --arg brokerImage "$BROKER_IMAGE" --arg goldenImageUrl "$GOLDEN_IMAGE_URL" --arg goldenImageSha256 "$GOLDEN_IMAGE_SHA256" --arg goldenCosignBundleUrl "$GOLDEN_COSIGN_BUNDLE_URL" --arg composeSha256 "$(cat dist/linux/compose.sha256)" --arg domainTemplateSha256 "$(cat dist/linux/domain.sha256)" '{orchestratorSha256:$orchestratorSha256,brokerImage:$brokerImage,goldenImageUrl:$goldenImageUrl,goldenImageSha256:$goldenImageSha256,goldenCosignBundleUrl:$goldenCosignBundleUrl,composeSha256:$composeSha256,domainTemplateSha256:$domainTemplateSha256}' > dist/linux/metadata.json
          echo "json=$(cat dist/linux/metadata.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: worker-linux-${{ github.sha }}
          path: dist/linux

  windows:
    name: Build Windows x64 worker
    runs-on: windows-2022
    outputs:
      metadata: ${{ steps.metadata.outputs.json }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - name: Build Windows worker binaries
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          bun build apps/orchestrator/src/index.ts --compile --target=bun-windows-x64 --outfile=dist/windows/mars-orchestrator.exe
          Copy-Item deploy/workers/install-worker.ps1,deploy/workers/build-windows-container-image-local.ps1,images/jobs/windows/verify-runtime.ps1,images/jobs/windows/Containerfile,images/jobs/windows/entrypoint.ps1 dist/windows
          cargo build --manifest-path apps/windows-service-host/Cargo.toml --release --target x86_64-pc-windows-gnu
          Copy-Item apps/windows-service-host/target/x86_64-pc-windows-gnu/release/mars-service-host.exe dist/windows/mars-service-host.exe
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: Acquire and sign Windows release artifacts
        id: metadata
        shell: pwsh
        env:
          VM_TEMPLATE_SOURCE_URL: ${{ vars.MARS_WINDOWS_VM_TEMPLATE_SOURCE_URL }}
          VM_TEMPLATE_URL: ${{ vars.MARS_WINDOWS_VM_TEMPLATE_URL }}
          VM_TEMPLATE_SHA256: ${{ vars.MARS_WINDOWS_VM_TEMPLATE_SHA256 }}
          BASE_IMAGE: ${{ vars.MARS_WINDOWS_CONTAINER_BASE_IMAGE }}
          RUNNER_URL: ${{ vars.MARS_WINDOWS_RUNNER_URL }}
          RUNNER_SHA256: ${{ vars.MARS_WINDOWS_RUNNER_SHA256 }}
          GIT_URL: ${{ vars.MARS_WINDOWS_GIT_URL }}
          GIT_SHA256: ${{ vars.MARS_WINDOWS_GIT_SHA256 }}
          VC_URL: ${{ vars.MARS_WINDOWS_VC_RUNTIME_URL }}
          VC_SHA256: ${{ vars.MARS_WINDOWS_VC_RUNTIME_SHA256 }}
        run: |
          $required = @($env:VM_TEMPLATE_SOURCE_URL,$env:VM_TEMPLATE_URL,$env:VM_TEMPLATE_SHA256,$env:BASE_IMAGE,$env:RUNNER_URL,$env:RUNNER_SHA256,$env:GIT_URL,$env:GIT_SHA256,$env:VC_URL,$env:VC_SHA256)
          if ($required | Where-Object { [string]::IsNullOrWhiteSpace($_) }) { throw 'Windows release asset metadata is incomplete' }
          if ($env:VM_TEMPLATE_SOURCE_URL -notmatch '^https://') { throw 'Windows VHDX source URL must use HTTPS' }
          if ($env:VM_TEMPLATE_URL -notmatch '^https://') { throw 'Windows VHDX URL must use HTTPS' }
          if ($env:VM_TEMPLATE_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'Windows VHDX SHA-256 is invalid' }
          if ($env:BASE_IMAGE -notmatch '^.+@sha256:[0-9a-f]{64}$') { throw 'Windows base image must be digest-pinned' }
          foreach ($asset in @(@($env:RUNNER_URL,$env:RUNNER_SHA256),@($env:GIT_URL,$env:GIT_SHA256),@($env:VC_URL,$env:VC_SHA256))) {
            if ($asset[0] -notmatch '^https://' -or $asset[1] -notmatch '^[0-9a-f]{64}$') { throw 'Windows dependency metadata is invalid' }
          }
          $vmTemplatePath = Join-Path $PWD 'dist/windows/mars-worker-template.vhdx'
          & curl.exe --fail --location --retry 3 --proto "=https" --proto-redir "=https" --tlsv1.2 --output $vmTemplatePath $env:VM_TEMPLATE_SOURCE_URL
          if ($LASTEXITCODE -ne 0) { throw 'Windows VHDX template download failed' }
          if (-not (Test-Path -LiteralPath $vmTemplatePath -PathType Leaf)) { throw 'Windows VHDX template download failed' }
          $actualVmSha256 = (Get-FileHash $vmTemplatePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualVmSha256 -ne $env:VM_TEMPLATE_SHA256) { throw 'Windows VHDX SHA-256 does not match metadata' }
          cosign sign-blob --yes --bundle dist/windows/mars-worker-template.vhdx.bundle $vmTemplatePath
          if (-not (Test-Path dist/windows/mars-worker-template.vhdx.bundle -PathType Leaf)) { throw 'Windows VHDX signature bundle is unavailable' }
          $orchestrator = (Get-FileHash dist/windows/mars-orchestrator.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $serviceHost = (Get-FileHash dist/windows/mars-service-host.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadata = [ordered]@{ orchestratorSha256=$orchestrator; serviceHostSha256=$serviceHost; vmTemplateUrl=$env:VM_TEMPLATE_URL; vmTemplateSha256=$env:VM_TEMPLATE_SHA256; container=[ordered]@{ baseImage=$env:BASE_IMAGE; runner=[ordered]@{url=$env:RUNNER_URL;sha256=$env:RUNNER_SHA256}; git=[ordered]@{url=$env:GIT_URL;sha256=$env:GIT_SHA256}; vcRuntime=[ordered]@{url=$env:VC_URL;sha256=$env:VC_SHA256} } }
          $metadata | ConvertTo-Json -Depth 6 -Compress | Set-Content dist/windows/metadata.json
          "json=$($metadata | ConvertTo-Json -Depth 6 -Compress)" | Out-File $env:GITHUB_OUTPUT -Append
      - uses: actions/upload-artifact@v4
        with:
          name: worker-windows-${{ github.sha }}
          path: dist/windows

  macos:
    name: Build Apple Silicon macOS worker
    runs-on: macos-14
    outputs:
      metadata: ${{ steps.metadata.outputs.json }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - uses: sigstore/cosign-installer@v3
      - name: Build macOS worker binaries
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          mkdir -p dist/macos
          bun build apps/orchestrator/src/index.ts --compile --target=bun-darwin-arm64 --outfile=dist/macos/mars-orchestrator
          bun build apps/job-agent/src/index.ts --compile --target=bun-darwin-arm64 --outfile=dist/macos/mars-job-agent
          cp deploy/workers/install-worker-macos.sh dist/macos/
      - name: Build and publish macOS Tart image
        id: tart
        env:
          TART_IMAGE: ${{ vars.MARS_MACOS_TART_IMAGE }}
          TART_SOURCE_IMAGE: ${{ vars.MARS_MACOS_TART_SOURCE_IMAGE }}
          TART_REGISTRY_USERNAME: ${{ github.actor }}
          TART_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for tool in tart docker jq cosign zsh shasum; do
            command -v "$tool" >/dev/null || { echo "required macOS release tool is unavailable: $tool" >&2; exit 1; }
          done
          tart --version
          docker buildx version >/dev/null
          test -n "$TART_IMAGE" || { echo "MARS_MACOS_TART_IMAGE is required" >&2; exit 1; }
          test -n "$TART_SOURCE_IMAGE" || { echo "MARS_MACOS_TART_SOURCE_IMAGE is required" >&2; exit 1; }
          test -n "$TART_REGISTRY_USERNAME" -a -n "$TART_REGISTRY_PASSWORD" || {
            echo "Tart registry credentials are required" >&2
            exit 1
          }
          [[ "$TART_SOURCE_IMAGE" =~ ^[a-z0-9./:_-]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "Tart source image must be an immutable OCI reference" >&2
            exit 1
          }
          if [[ "$TART_IMAGE" == *@sha256:* ]]; then
            TART_REPOSITORY="${TART_IMAGE%@*}"
          else
            TART_REPOSITORY="$TART_IMAGE"
          fi
          [[ "$TART_REPOSITORY" =~ ^[a-z0-9.-]+/[a-z0-9._/-]+$ ]] || {
            echo "MARS_MACOS_TART_IMAGE must name a registry repository" >&2
            exit 1
          }
          TART_REGISTRY_HOSTNAME="${TART_REPOSITORY%%/*}"
          TART_SOURCE_REPOSITORY="${TART_SOURCE_IMAGE%@*}"
          TART_SOURCE_REGISTRY_HOSTNAME="${TART_SOURCE_REPOSITORY%%/*}"
          export TART_REGISTRY_HOSTNAME TART_SOURCE_REGISTRY_HOSTNAME
          if [[ "$TART_SOURCE_REPOSITORY" == */* && "$TART_SOURCE_REGISTRY_HOSTNAME" != "$TART_REGISTRY_HOSTNAME" ]]; then
            printf '%s' "$TART_REGISTRY_PASSWORD" | docker login "$TART_SOURCE_REGISTRY_HOSTNAME" --username "$TART_REGISTRY_USERNAME" --password-stdin
          fi
          printf '%s' "$TART_REGISTRY_PASSWORD" | docker login "$TART_REGISTRY_HOSTNAME" --username "$TART_REGISTRY_USERNAME" --password-stdin
          tart pull "$TART_SOURCE_IMAGE"
          TARGET="mars-macos-worker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          zsh deploy/workers/prepare-macos-job-image.sh \
            --source "$TART_SOURCE_IMAGE" \
            --target "$TARGET" \
            --job-agent dist/macos/mars-job-agent
          PUBLISHED_REF="$TART_REPOSITORY:$BUILD_ID"
          tart push "$TARGET" "$PUBLISHED_REF"
          tartDigest="$(docker buildx imagetools inspect "$PUBLISHED_REF" --format '{{.Manifest.Digest}}')"
          [[ "$tartDigest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "published Tart image digest is unavailable" >&2
            exit 1
          }
          TART_IMAGE="$TART_REPOSITORY@$tartDigest"
          tart clone "$TART_IMAGE" "${TARGET}-verify"
          tart delete "${TARGET}-verify"
          cosign sign --yes "$TART_IMAGE"
          tart delete "$TARGET"
          echo "image=$TART_IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=${tartDigest#sha256:}" >> "$GITHUB_OUTPUT"
      - name: Write macOS release metadata
        id: metadata
        env:
          TART_IMAGE: ${{ steps.tart.outputs.image }}
          TART_IMAGE_DIGEST: ${{ steps.tart.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$TART_IMAGE" -a -n "$TART_IMAGE_DIGEST"
          [[ "$TART_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "Tart image must be digest-pinned" >&2; exit 1; }
          [[ "$TART_IMAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "Tart image digest is invalid" >&2; exit 1; }
          test "$TART_IMAGE" = "${TART_IMAGE%@*}@sha256:$TART_IMAGE_DIGEST"
          orchestratorSha256="$(shasum -a 256 dist/macos/mars-orchestrator | cut -d' ' -f1)"
          jq -cn --arg orchestratorSha256 "$orchestratorSha256" --arg tartImage "$TART_IMAGE" --arg tartImageDigest "$TART_IMAGE_DIGEST" '{orchestratorSha256:$orchestratorSha256,tartImage:$tartImage,tartImageDigest:$tartImageDigest}' > dist/macos/metadata.json
          echo "json=$(cat dist/macos/metadata.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: worker-macos-${{ github.sha }}
          path: dist/macos

  aggregate:
    name: Sign and publish complete worker manifest
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - name: Install validation dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: worker-*
          path: dist
          merge-multiple: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Assemble and validate schema-2 manifest
        run: |
          linux=$(cat dist/worker-linux-${{ github.sha }}/metadata.json)
          windows=$(cat dist/worker-windows-${{ github.sha }}/metadata.json)
          macos=$(cat dist/worker-macos-${{ github.sha }}/metadata.json)
          jq -n --arg buildId "$BUILD_ID" --arg contractVersion "$CONTRACT_VERSION" --argjson linux "$linux" --argjson windows "$windows" --argjson macos "$macos" '{schemaVersion:2,buildId:$buildId,contractVersion:$contractVersion,platforms:{"linux-x64":$linux,"windows-x64":$windows,"macos-arm64":$macos}}' > dist/worker-release-manifest.json
          bun -e 'import { WorkerReleaseManifest } from "./packages/contracts/src/worker-release.ts"; WorkerReleaseManifest.parse(JSON.parse(await Bun.file("dist/worker-release-manifest.json").text()))'
      - name: Sign release manifest
        run: |
          cosign sign-blob --yes --bundle dist/worker-release-manifest.json.bundle dist/worker-release-manifest.json
      - name: Build control-plane image with the signed manifest
        run: |
          docker buildx build --push --build-arg MARS_BUILD_ID="$BUILD_ID" --build-arg MARS_RELEASE_MANIFEST=dist/worker-release-manifest.json --build-arg MARS_WINDOWS_SERVICE_HOST_ARTIFACT="dist/worker-windows-${{ github.sha }}/mars-service-host.exe" -f deploy/control-plane/Dockerfile -t ghcr.io/${{ github.repository }}/control-plane:worker-${{ github.sha }} .
      - uses: actions/upload-artifact@v4
        with:
          name: worker-release-manifest-${{ github.sha }}
          path: dist/worker-release-manifest.json*
      - name: Publish complete worker release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/worker-release-manifest.json dist/worker-release-manifest.json.bundle \
            dist/worker-linux-${{ github.sha }}/mars-worker-golden.qcow2 \
            dist/worker-linux-${{ github.sha }}/mars-worker-golden.qcow2.bundle \
            dist/worker-windows-${{ github.sha }}/mars-worker-template.vhdx \
            dist/worker-windows-${{ github.sha }}/mars-worker-template.vhdx.bundle \
            --generate-notes
