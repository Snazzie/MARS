name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  compose:
    name: Validate production Compose
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose interpolation
        env:
          WHITESMITH_BUILD_ID: ci
          WHITESMITH_RELEASE_DIGEST: sha256:${{ hashFiles('deploy/control-plane/Dockerfile') }}
          PUBLIC_BASE_URL: https://example.invalid
          BROWSER_BASE_URL: https://example.invalid
          POSTGRES_PASSWORD: ci-only
          BOOTSTRAP_GITHUB_LOGIN: ci
          GITHUB_OAUTH_CLIENT_ID: ci
          GITHUB_OAUTH_CLIENT_SECRET: ci
          GITHUB_WEBHOOK_SECRET: ci
        run: docker compose -f deploy/control-plane/compose.yaml config -q
