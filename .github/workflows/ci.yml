name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - uses: docker/setup-buildx-action@v3
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/db db:check
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Build immutable control-plane image
        run: docker buildx build --load -f deploy/control-plane/Dockerfile -t whitesmith-control-plane:ci .
      - name: Verify release artifact set
        run: docker run --rm --entrypoint /bin/sh whitesmith-control-plane:ci -c 'test -f /app/index.js && test -f /app/web/index.html && test -f /app/web/index.js && test -f /app/web/index.css && test -f /app/migrations/0000_legacy_baseline.sql && test -f /app/migrations/meta/_journal.json && test -f /app/workers/install-worker.ps1 && test -f /app/workers/whitesmith-orchestrator.exe && test -f /app/workers/whitesmith-service-host.exe'
      - name: Smoke test control-plane startup
        env:
          IMAGE: whitesmith-control-plane:ci
        run: bash tests/control-plane-image-smoke.sh

  compose:
    name: Validate production Compose
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose interpolation
        env:
          WHITESMITH_BUILD_ID: ci
          WHITESMITH_RELEASE_DIGEST: sha256:${{ hashFiles('deploy/control-plane/Dockerfile') }}
          PUBLIC_BASE_URL: https://example.invalid
          BROWSER_BASE_URL: https://example.invalid
          POSTGRES_PASSWORD: ci-only
          BOOTSTRAP_GITHUB_LOGIN: ci
          GITHUB_OAUTH_CLIENT_ID: ci
          GITHUB_OAUTH_CLIENT_SECRET: ci
          GITHUB_WEBHOOK_SECRET: ci
          WHITESMITH_WINDOWS_CONTAINER_BASE_IMAGE: mcr.microsoft.com/windows/servercore:ltsc2025@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WHITESMITH_WINDOWS_CONTAINER_RUNNER_URL: https://example.invalid/runner.zip
          WHITESMITH_WINDOWS_CONTAINER_RUNNER_SHA256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WHITESMITH_WINDOWS_CONTAINER_GIT_URL: https://example.invalid/git.zip
          WHITESMITH_WINDOWS_CONTAINER_GIT_SHA256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          WHITESMITH_WINDOWS_CONTAINER_VC_URL: https://example.invalid/vc.exe
          WHITESMITH_WINDOWS_CONTAINER_VC_SHA256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        run: docker compose -f deploy/control-plane/compose.yaml config -q
