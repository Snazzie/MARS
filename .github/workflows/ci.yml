name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - uses: docker/setup-buildx-action@v3
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/db db:check
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Build Windows service-host artifact for CI image
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mingw-w64
          rustup target add x86_64-pc-windows-gnu
          cargo build --manifest-path apps/windows-service-host/Cargo.toml --release --target x86_64-pc-windows-gnu
          mkdir -p dist/worker-windows-ci
          cp apps/windows-service-host/target/x86_64-pc-windows-gnu/release/mars-service-host.exe dist/worker-windows-ci/mars-service-host.exe
          test -s dist/worker-windows-ci/mars-service-host.exe
      - name: Build immutable control-plane image
        run: docker buildx build --load --build-arg MARS_BUILD_ID=ci --build-arg MARS_WINDOWS_SERVICE_HOST_ARTIFACT=dist/worker-windows-ci/mars-service-host.exe -f deploy/control-plane/Dockerfile -t mars-control-plane:ci .
      - name: Verify release artifact set
        run: docker run --rm --entrypoint /bin/sh mars-control-plane:ci -c 'test -f /app/index.js && test -f /app/web/index.html && test -f /app/web/index.js && test -f /app/web/index.css && test -f /app/migrations/0000_mars_baseline.sql && test -f /app/migrations/meta/_journal.json && test -f /app/release-manifest.json && test -f /app/workers/install-worker.sh && test -f /app/workers/install-worker.ps1 && test -f /app/workers/install-worker-macos.sh && test -f /app/workers/linux-broker-compose.yaml && test -f /app/workers/worker-domain.xml && test -f /app/workers/mars-orchestrator && test -f /app/workers/mars-orchestrator.exe && test -f /app/workers/mars-orchestrator-macos-arm64 && test -f /app/workers/mars-service-host.exe'
      - name: Smoke test control-plane startup
        env:
          IMAGE: mars-control-plane:ci
        run: bash tests/control-plane-image-smoke.sh

  compose:
    name: Validate production Compose
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose interpolation
        env:
          DATABASE_URL: postgres://mars:ci@db.example:5432/mars
          PUBLIC_BASE_URL: https://control.example.test
        run: docker compose -f deploy/control-plane/compose.yaml config -q
