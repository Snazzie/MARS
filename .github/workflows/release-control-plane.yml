name: Release control plane

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Publish immutable control-plane image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Embed Windows worker release metadata
        env:
          BASE_IMAGE: ${{ vars.WHITESMITH_WINDOWS_CONTAINER_BASE_IMAGE }}
          RUNNER_URL: ${{ vars.WHITESMITH_WINDOWS_CONTAINER_RUNNER_URL }}
          RUNNER_SHA256: ${{ vars.WHITESMITH_WINDOWS_CONTAINER_RUNNER_SHA256 }}
          GIT_URL: ${{ vars.WHITESMITH_WINDOWS_CONTAINER_GIT_URL }}
          GIT_SHA256: ${{ vars.WHITESMITH_WINDOWS_CONTAINER_GIT_SHA256 }}
          VC_URL: ${{ vars.WHITESMITH_WINDOWS_CONTAINER_VC_URL }}
          VC_SHA256: ${{ vars.WHITESMITH_WINDOWS_CONTAINER_VC_SHA256 }}
        run: |
          test -n "$BASE_IMAGE" -a -n "$RUNNER_URL" -a -n "$RUNNER_SHA256" -a -n "$GIT_URL" -a -n "$GIT_SHA256" -a -n "$VC_URL" -a -n "$VC_SHA256"
          jq -n \
            --arg baseImage "$BASE_IMAGE" \
            --arg runnerUrl "$RUNNER_URL" \
            --arg runnerSha256 "$RUNNER_SHA256" \
            --arg gitUrl "$GIT_URL" \
            --arg gitSha256 "$GIT_SHA256" \
            --arg vcUrl "$VC_URL" \
            --arg vcSha256 "$VC_SHA256" \
            '{schemaVersion: 1, windowsContainerBuild: {baseImage: $baseImage, runnerUrl: $runnerUrl, runnerSha256: $runnerSha256, gitUrl: $gitUrl, gitSha256: $gitSha256, vcUrl: $vcUrl, vcSha256: $vcSha256}}' \
            > deploy/control-plane/release-manifest.json
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/forgedatscale/whitesmith/control-plane
          tags: |
            type=ref,event=tag
            type=sha
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/control-plane/Dockerfile
          build-args: |
            WHITESMITH_BUILD_ID=${{ github.sha }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: true
          sbom: true
      - name: Verify immutable release image
        env:
          IMAGE: ghcr.io/forgedatscale/whitesmith/control-plane
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$DIGEST"
          case "$DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "Invalid digest: $DIGEST" >&2; exit 1 ;; esac
          docker run --rm --entrypoint /bin/sh "$IMAGE@$DIGEST" -c 'test -f /app/index.js && test -f /app/web/index.html && test -f /app/web/index.js && test -f /app/web/index.css && test -f /app/migrations/0000_legacy_baseline.sql && test -f /app/migrations/meta/_journal.json && test -f /app/workers/install-worker.ps1 && test -f /app/workers/whitesmith-orchestrator.exe && test -f /app/workers/whitesmith-service-host.exe'
      - name: Smoke test immutable release image
        env:
          IMAGE: ghcr.io/forgedatscale/whitesmith/control-plane@${{ steps.image.outputs.digest }}
        run: bash tests/control-plane-image-smoke.sh
      - name: Publish release metadata
        env:
          IMAGE: ghcr.io/forgedatscale/whitesmith/control-plane
          DIGEST: ${{ steps.image.outputs.digest }}
          BUILD_ID: ${{ github.sha }}
        run: |
          {
            printf 'image=%s\n' "$IMAGE"
            printf 'digest=%s\n' "$DIGEST"
            printf 'build_id=%s\n' "$BUILD_ID"
          } > control-plane-release.txt
          cat control-plane-release.txt
      - uses: actions/upload-artifact@v4
        with:
          name: control-plane-release-metadata
          path: control-plane-release.txt
