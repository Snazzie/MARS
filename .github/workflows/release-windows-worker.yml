name: Release Windows worker

on:
  workflow_dispatch:
  push:
    tags: ['windows-worker-*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Windows worker artifacts
        run: |
          mkdir -p dist
          docker build --target build -f deploy/control-plane/Dockerfile -t mars-windows-build:${{ github.sha }} .
          build_container="$(docker create mars-windows-build:${{ github.sha }})"
          trap 'docker rm "$build_container" >/dev/null' EXIT
          docker cp "$build_container:/artifacts/mars-orchestrator.exe" dist/mars-orchestrator.exe
          docker cp "$build_container:/app/apps/job-agent/dist/mars-job-agent" dist/mars-job-agent.exe
          docker build --target windows-service-host -f deploy/control-plane/Dockerfile -t mars-windows-service-host:${{ github.sha }} .
          service_container="$(docker create mars-windows-service-host:${{ github.sha }})"
          trap 'docker rm "$service_container" >/dev/null' EXIT
          docker cp "$service_container:/src/apps/windows-service-host/target/x86_64-pc-windows-gnu/release/mars-service-host.exe" dist/mars-service-host.exe
          cp deploy/workers/install-worker.ps1 dist/install-worker.ps1
      - name: Write worker release metadata
        run: |
          CONTRACT_VERSION="$(node -p "require('./packages/contracts/package.json').version")"
          jq -n \
            --arg contractVersion "$CONTRACT_VERSION" \
            --arg buildId "${{ github.sha }}" \
            '{schemaVersion: 1, product: "Mars", worker: "windows-x64", contractVersion: $contractVersion, buildId: $buildId}' \
            > dist/mars-windows-worker-release.json
      - name: Package Windows worker release
        run: zip -j "mars-windows-worker-${{ github.sha }}.zip" dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: mars-windows-worker-${{ github.sha }}
          path: |
            dist/*
            mars-windows-worker-${{ github.sha }}.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" mars-windows-worker-${{ github.sha }}.zip --generate-notes
