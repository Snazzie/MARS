name: Mars retry label smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry:
    runs-on: [mars-any-2vcpu-4g, mars-retry-3]
    timeout-minutes: 15
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Fail once and succeed on GitHub rerun
        run: bun -e "if (process.env.GITHUB_RUN_ATTEMPT === '1') process.exit(1); console.log('Mars retry smoke succeeded on attempt', process.env.GITHUB_RUN_ATTEMPT)"
