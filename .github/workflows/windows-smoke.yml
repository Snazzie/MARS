name: Windows runner smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: mars-windows-x64
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Install Playwright Chromium
        run: bunx playwright install chromium
      - name: Create Playwright page
        run: node tests/windows-playwright-smoke.mjs
      - name: Inspect runner
        shell: powershell
        run: |
          $PSVersionTable
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsArchitecture
          Get-CimInstance Win32_ComputerSystem | Select-Object Manufacturer,Model,TotalPhysicalMemory
          test-path package.json
          test-path .github/workflows
      - name: Verify Mars Windows runner
        shell: powershell
        run: |
          if ($env:RUNNER_OS -ne 'Windows') { throw "Expected Windows runner, got $env:RUNNER_OS" }
          if ($env:RUNNER_ARCH -ne 'X64') { throw "Expected x64 runner, got $env:RUNNER_ARCH" }
          if ($env:RUNNER_NAME -notmatch '^mars-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') {
            throw "Unexpected Mars runner name: $env:RUNNER_NAME"
          }
          Write-Host "Picked up by $env:RUNNER_NAME"
      - name: Execute Windows smoke workload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $result = [ordered]@{
            runner = $env:RUNNER_NAME
            os = $env:RUNNER_OS
            arch = $env:RUNNER_ARCH
            powershell = $PSVersionTable.PSVersion.ToString()
            workspace = (Get-Location).Path
          }
          $result | ConvertTo-Json -Compress
          if (-not (Test-Path -LiteralPath 'package.json')) { throw 'Workspace was not mounted on the Windows runner' }
