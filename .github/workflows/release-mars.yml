name: Release Mars

"on":
  workflow_dispatch:
    inputs:
      app_version:
        description: SemVer for the control-plane application release
        required: true
        type: string
      worker_release_mode:
        description: Build all worker platforms or reuse an immutable published worker release
        required: true
        type: choice
        options: [build, reuse]
      worker_version:
        description: SemVer of the worker release (required in build mode)
        required: false
        type: string
      worker_manifest_url:
        description: Immutable worker-v<semver> manifest URL (required in reuse mode)
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_IMAGE: ghcr.io/snazzie/mars/control-plane
  BROKER_IMAGE: ghcr.io/snazzie/mars/linux-broker
  APP_VERSION: "${{ inputs.app_version }}"
  WORKER_MODE: "${{ inputs.worker_release_mode }}"
  WORKER_VERSION: "${{ inputs.worker_version }}"
  WORKER_MANIFEST_URL: "${{ inputs.worker_manifest_url }}"
  BUILD_ID: "${{ github.sha }}"
  CONTRACT_VERSION_FILE: deploy/workers/contract-version.txt
  APP_CANDIDATE_TAG: "cp-${{ github.run_id }}-${{ github.run_attempt }}"
  BROKER_CANDIDATE_TAG: "worker-${{ github.run_id }}-${{ github.run_attempt }}"

jobs:
  validate-inputs:
    name: Validate exact release inputs and CI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      contract_version: "${{ steps.values.outputs.contract_version }}"
      manifest_url: "${{ steps.values.outputs.manifest_url }}"
      worker_version: "${{ steps.values.outputs.worker_version }}"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Validate dispatch branch, versions, and immutable reuse URL
        id: values
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Release Mars must be dispatched from main' >&2; exit 1; }
          [[ "$APP_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'app_version must be SemVer' >&2; exit 1; }
          contract_version=$(tr -d '[:space:]' < "$CONTRACT_VERSION_FILE")
          [[ "$contract_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'worker contract version is invalid' >&2; exit 1; }
          if gh release view "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "final app release already exists: v$APP_VERSION" >&2; exit 1; fi
          if [[ "$WORKER_MODE" == build ]]; then
            [[ "$WORKER_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'worker_version is required and must be SemVer in build mode' >&2; exit 1; }
            if gh release view "worker-v$WORKER_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "worker release already exists: worker-v$WORKER_VERSION" >&2; exit 1; fi
            worker_url="https://github.com/Snazzie/MARS/releases/download/worker-v$WORKER_VERSION/worker-release-manifest.json"
            worker_version="$WORKER_VERSION"
          elif [[ "$WORKER_MODE" == reuse ]]; then
            [[ "$WORKER_VERSION" == '' ]] || { echo 'worker_version must be omitted in reuse mode' >&2; exit 1; }
            [[ "$WORKER_MANIFEST_URL" =~ ^https://github\.com/Snazzie/MARS/releases/download/worker-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)/worker-release-manifest\.json$ ]] || { echo 'worker_manifest_url must be an immutable worker-v<semver> URL' >&2; exit 1; }
            worker_url="$WORKER_MANIFEST_URL"
            worker_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else echo 'worker_release_mode must be build or reuse' >&2; exit 1; fi
          ci=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")
          jq -e '[.check_runs[] | select(.name == "validate" or .name == "Typecheck, test, and build") | select(.head_sha == env.GITHUB_SHA and .status == "completed" and .conclusion == "success")] | length > 0' <<<"$ci" >/dev/null || { echo 'no successful exact-SHA core CI check' >&2; exit 1; }
          printf 'contract_version=%s\nmanifest_url=%s\nworker_version=%s\n' "$contract_version" "$worker_url" "$worker_version" >> "$GITHUB_OUTPUT"

  linux:
    name: Build Linux x64 worker assets
    if: inputs.worker_release_mode == 'build'
    needs: validate-inputs
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    outputs: { metadata: "${{ steps.metadata.outputs.json }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - name: Build Linux worker binaries and appliance
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          mkdir -p dist/linux
          bun build apps/orchestrator/src/index.ts --compile --target=bun-linux-x64 --outfile=dist/linux/mars-orchestrator
          bun build apps/job-agent/src/index.ts --compile --target=bun-linux-x64 --outfile=dist/linux/mars-job-agent
          cp deploy/workers/install-worker.sh deploy/workers/linux-broker-compose.yaml deploy/workers/worker-domain.xml dist/linux/
          runner_url=$(curl --fail --location --proto '=https' --tlsv1.2 -H "Authorization: Bearer $GH_TOKEN" 'https://api.github.com/repos/actions/runner/releases?per_page=30' | jq -r '[.[] | select(.draft == false and .prerelease == false)][0].assets[] | select(.name | test("^actions-runner-linux-x64-[0-9.]+\\.tar\\.gz$")) | .browser_download_url')
          [[ "$runner_url" == https://* ]] || { echo 'Actions Runner Linux asset was not found' >&2; exit 1; }
          runner_sha256=$(curl --fail --location --proto '=https' --tlsv1.2 "$runner_url" | sha256sum | cut -d' ' -f1)
          export LIBGUESTFS_BACKEND=direct LIBGUESTFS_BACKEND_SETTINGS=force_tcg
          sudo chmod a+rx /boot; sudo chmod a+r /boot/vmlinuz-*
          sudo apt-get update; sudo apt-get install --no-install-recommends -y libguestfs-tools qemu-utils
          sudo -E env LIBGUESTFS_BACKEND=direct LIBGUESTFS_BACKEND_SETTINGS=force_tcg RUNNER_ARCHIVE_URL="$runner_url" RUNNER_ARCHIVE_SHA256="$runner_sha256" JOB_AGENT_BINARY=dist/linux/mars-job-agent UBUNTU_QCOW2_URL=https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img images/worker-appliance/build.sh mars-worker-golden
          mv dist/mars-worker-golden.qcow2 dist/linux/mars-worker-golden.qcow2
          mv dist/mars-worker-golden.qcow2.sha256 dist/linux/mars-worker-golden.qcow2.sha256
          docker buildx build --platform linux/amd64 --push -f deploy/workers/linux-broker.Dockerfile -t "$BROKER_IMAGE:worker-v$WORKER_VERSION" -t "$BROKER_IMAGE:$BROKER_CANDIDATE_TAG" .
          digest=$(docker buildx imagetools inspect "$BROKER_IMAGE:worker-v$WORKER_VERSION" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          base="https://github.com/Snazzie/MARS/releases/download/worker-v$WORKER_VERSION"
          asset() { printf '{"url":"%s/%s","sha256":"%s"}' "$base" "$2" "$(sha256sum "$1" | cut -d' ' -f1)"; }
          jq -cn --argjson installer "$(asset dist/linux/install-worker.sh install-worker-linux-x64.sh)" --argjson orchestrator "$(asset dist/linux/mars-orchestrator mars-orchestrator-linux-x64)" --argjson jobAgent "$(asset dist/linux/mars-job-agent mars-job-agent-linux-x64)" --arg brokerImage "$BROKER_IMAGE@$digest" --argjson goldenImage "$(asset dist/linux/mars-worker-golden.qcow2 mars-worker-golden.qcow2)" --argjson compose "$(asset dist/linux/linux-broker-compose.yaml linux-broker-compose.yaml)" --argjson domainTemplate "$(asset dist/linux/worker-domain.xml worker-domain.xml)" '{installer:$installer,orchestrator:$orchestrator,jobAgent:$jobAgent,brokerImage:$brokerImage,goldenImage:$goldenImage,compose:$compose,domainTemplate:$domainTemplate}' > dist/linux/metadata.json
      - id: metadata
        run: echo "json=$(cat dist/linux/metadata.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: "worker-linux-${{ github.sha }}", path: dist/linux }
  linux-arm64:
    name: Build Linux ARM64 Docker worker assets
    if: inputs.worker_release_mode == 'build'
    needs: validate-inputs
    runs-on: ubuntu-24.04-arm
    permissions: { contents: read, packages: write }
    outputs: { metadata: "${{ steps.metadata.outputs.json }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - name: Build ARM64 Docker worker and artifacts
        id: metadata
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          bun install --frozen-lockfile
          bun run scripts/build-linux-arm64-release.ts
      - uses: actions/upload-artifact@v4
        with: { name: "worker-linux-arm64-${{ github.sha }}", path: dist/linux-arm64 }

  windows:
    name: Build Windows x64 worker assets
    if: inputs.worker_release_mode == 'build'
    needs: validate-inputs
    runs-on: windows-2022
    permissions: { contents: read }
    outputs: { metadata: "${{ steps.metadata.outputs.json }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - name: Build Windows worker binaries and dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun install --frozen-lockfile
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          bun build apps/orchestrator/src/index.ts --compile --target=bun-windows-x64 --outfile=dist/windows/mars-orchestrator.exe
          bun build apps/job-agent/src/index.ts --compile --target=bun-windows-x64 --outfile=dist/windows/mars-job-agent.exe
          Copy-Item deploy/workers/install-worker.ps1,deploy/workers/mars-worker-tray.ps1,assets/MARS.ico,deploy/workers/build-windows-container-image-local.ps1,images/jobs/windows/verify-runtime.ps1,images/jobs/windows/Containerfile,images/jobs/windows/entrypoint.ps1 dist/windows
          rustup target add x86_64-pc-windows-gnu
          cargo build --manifest-path apps/windows-service-host/Cargo.toml --release --target x86_64-pc-windows-gnu
          Copy-Item apps/windows-service-host/target/x86_64-pc-windows-gnu/release/mars-service-host.exe dist/windows/mars-service-host.exe
          & ./images/actions-runner/build-windows.ps1 -OutputPath dist/windows/mars-windows-runner.zip
          $gitRelease = (curl.exe --fail --location --proto '=https' --tlsv1.2 'https://api.github.com/repos/git-for-windows/git/releases?per_page=30' | ConvertFrom-Json) | Where-Object { -not $_.draft -and -not $_.prerelease } | Select-Object -First 1
          $gitAsset = $gitRelease.assets | Where-Object name -Match '^MinGit-[0-9.]+-64-bit\.zip$' | Select-Object -First 1
          curl.exe --fail --location --proto '=https' --tlsv1.2 --output dist/windows/mars-windows-git.zip $gitAsset.browser_download_url
          curl.exe --fail --location --proto '=https' --tlsv1.2 --output dist/windows/mars-windows-vc-runtime.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          $baseDigest = (docker manifest inspect mcr.microsoft.com/windows/server:ltsc2025 | ConvertFrom-Json).manifests | Where-Object { $_.platform.os -eq 'windows' -and $_.platform.architecture -eq 'amd64' } | Select-Object -First 1 -ExpandProperty digest
          if ($baseDigest -notmatch '^sha256:[0-9a-f]{64}$') { throw 'Windows base image has no immutable digest' }
          [ordered]@{ baseImage="mcr.microsoft.com/windows/server:ltsc2025@$baseDigest" } | ConvertTo-Json | Set-Content dist/windows/dependencies.json
      - id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $base="https://github.com/Snazzie/MARS/releases/download/worker-v$env:WORKER_VERSION"
          function Asset($file,$name) { [ordered]@{url="$base/$name";sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath "dist/windows/$file").Hash.ToLowerInvariant()} }
          $d=Get-Content dist/windows/dependencies.json -Raw|ConvertFrom-Json
          $c=[ordered]@{baseImage=$d.baseImage;runner=Asset 'mars-windows-runner.zip' 'mars-windows-runner.zip';git=Asset 'mars-windows-git.zip' 'mars-windows-git.zip';vcRuntime=Asset 'mars-windows-vc-runtime.exe' 'mars-windows-vc-runtime.exe';buildScript=Asset 'build-windows-container-image-local.ps1' 'build-windows-container-image-local.ps1';verifyScript=Asset 'verify-runtime.ps1' 'verify-runtime.ps1';containerfile=Asset 'Containerfile' 'Containerfile';entrypoint=Asset 'entrypoint.ps1' 'entrypoint.ps1'}
          $m=[ordered]@{installer=Asset 'install-worker.ps1' 'install-worker-windows-x64.ps1';orchestrator=Asset 'mars-orchestrator.exe' 'mars-orchestrator-windows-x64.exe';serviceHost=Asset 'mars-service-host.exe' 'mars-service-host.exe';jobAgent=Asset 'mars-job-agent.exe' 'mars-job-agent-windows-x64.exe';trayScript=Asset 'mars-worker-tray.ps1' 'mars-worker-tray.ps1';container=$c}; $m|ConvertTo-Json -Depth 8 -Compress|Set-Content dist/windows/metadata.json; "json=$(Get-Content dist/windows/metadata.json -Raw)"|Out-File $env:GITHUB_OUTPUT -Append
      - uses: actions/upload-artifact@v4
        with: { name: "worker-windows-${{ github.sha }}", path: dist/windows }

  macos-status-item:
    name: Build macOS status item
    if: inputs.worker_release_mode == 'build'
    needs: validate-inputs
    runs-on: macos-14
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Build status item
        run: |
          set -euo pipefail
          mkdir -p dist/macos
          swiftc -parse-as-library -framework AppKit apps/macos-status-item/main.swift -o dist/macos/mars-status-item
      - uses: actions/upload-artifact@v4
        with: { name: "worker-macos-status-item-${{ github.sha }}", path: dist/macos }
  macos:
    name: Build macOS arm64 worker assets
    if: inputs.worker_release_mode == 'build'
    needs: [validate-inputs, macos-status-item]
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - uses: actions/download-artifact@v4
        with: { name: "worker-macos-status-item-${{ github.sha }}", path: dist/macos }
      - name: Build macOS worker assets
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          mkdir -p dist/macos
          bun build apps/orchestrator/src/index.ts --compile --target=bun-darwin-arm64 --outfile=dist/macos/mars-orchestrator
          bun build apps/job-agent/src/index.ts --compile --target=bun-darwin-arm64 --outfile=dist/macos/mars-job-agent
          cp assets/MARS.icns dist/macos/
          bun build apps/job-agent/src/index.ts --compile --target=bun-linux-arm64 --outfile=dist/macos/mars-linux-arm64-job-agent
          cp deploy/workers/install-worker-macos.sh deploy/workers/prepare-tart-job-image.sh dist/macos/
          runner_url=$(curl --fail --location --proto '=https' --tlsv1.2 -H "Authorization: Bearer $GH_TOKEN" 'https://api.github.com/repos/actions/runner/releases?per_page=30' | jq -r '[.[] | select(.draft == false and .prerelease == false)][0].assets[] | select(.name | test("^actions-runner-linux-arm64-[0-9.]+\\.tar\\.gz$")) | .browser_download_url')
          [[ "$runner_url" == https://* ]] || { echo 'Actions Runner Linux ARM64 asset was not found' >&2; exit 1; }
          curl --fail --location --proto '=https' --tlsv1.2 "$runner_url" --output dist/macos/mars-linux-arm64-runner.tar.gz
          digest=$(docker buildx imagetools inspect ghcr.io/cirruslabs/macos-sonoma-base:latest --format '{{.Manifest.Digest}}')
          linux_digest=$(docker buildx imagetools inspect ghcr.io/cirruslabs/ubuntu:latest --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ && "$linux_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          chmod +x dist/macos/mars-status-item
          base="https://github.com/Snazzie/MARS/releases/download/worker-v$WORKER_VERSION"
          asset() { printf '{"url":"%s/%s","sha256":"%s"}' "$base" "$2" "$(sha256sum "$1" | cut -d' ' -f1)"; }
          jq -cn --arg tartMacosSourceImage "ghcr.io/cirruslabs/macos-sonoma-base@$digest" --arg tartLinuxArm64SourceImage "ghcr.io/cirruslabs/ubuntu@$linux_digest" --argjson installer "$(asset dist/macos/install-worker-macos.sh install-worker-macos-arm64.sh)" --argjson orchestrator "$(asset dist/macos/mars-orchestrator mars-orchestrator-macos-arm64)" --argjson macosJobAgent "$(asset dist/macos/mars-job-agent mars-job-agent-macos-arm64)" --argjson linuxArm64JobAgent "$(asset dist/macos/mars-linux-arm64-job-agent mars-linux-arm64-job-agent)" --argjson linuxArm64Runner "$(asset dist/macos/mars-linux-arm64-runner.tar.gz mars-linux-arm64-runner.tar.gz)" --argjson imagePreparationScript "$(asset dist/macos/prepare-tart-job-image.sh prepare-tart-job-image.sh)" '{installer:$installer,orchestrator:$orchestrator,macosJobAgent:$macosJobAgent,linuxArm64JobAgent:$linuxArm64JobAgent,linuxArm64Runner:$linuxArm64Runner,imagePreparationScript:$imagePreparationScript,tartMacosSourceImage:$tartMacosSourceImage,tartLinuxArm64SourceImage:$tartLinuxArm64SourceImage}' > dist/macos/metadata.json
      - id: metadata
        run: echo "json=$(cat dist/macos/metadata.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: "worker-macos-${{ github.sha }}", path: dist/macos }

  worker-release:
    name: Validate and publish worker prerelease
    if: inputs.worker_release_mode == 'build'
    needs: [validate-inputs, linux, linux-arm64, windows, macos]
    runs-on: ubuntu-24.04
    permissions: { contents: write, packages: write }
    outputs: { manifest_url: "${{ needs.validate-inputs.outputs.manifest_url }}" }
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: worker-*, path: dist, merge-multiple: false }
      - name: Install and validate schema-5 contract
        run: |
          set -euo pipefail; bun install --frozen-lockfile
          linux=$(cat "dist/worker-linux-$GITHUB_SHA/metadata.json"); linux_arm64=$(cat "dist/worker-linux-arm64-$GITHUB_SHA/metadata.json"); windows=$(cat "dist/worker-windows-$GITHUB_SHA/metadata.json"); macos=$(cat "dist/worker-macos-$GITHUB_SHA/metadata.json")
          jq -n --arg buildId "$BUILD_ID" --arg contractVersion "$(cat "$CONTRACT_VERSION_FILE")" --argjson linux "$linux" --argjson linux_arm64 "$linux_arm64" --argjson windows "$windows" --argjson macos "$macos" '{schemaVersion:5,buildId:$buildId,contractVersion:$contractVersion,platforms:{"linux-x64":$linux,"linux-arm64":$linux_arm64,"windows-x64":$windows,"macos-arm64":$macos}}' > dist/worker-release-manifest.json
          bun -e 'import { WorkerReleaseManifest } from "./packages/contracts/src/worker-release.ts"; WorkerReleaseManifest.parse(JSON.parse(await Bun.file("dist/worker-release-manifest.json").text()))'
          mkdir -p dist/release; cp dist/worker-release-manifest.json dist/release/worker-release-manifest.json
          cp dist/worker-linux-arm64-$GITHUB_SHA/install-worker-linux-arm64.ps1 dist/release/install-worker-linux-arm64.ps1; cp dist/worker-linux-arm64-$GITHUB_SHA/linux-arm64-broker-compose.yaml dist/release/linux-arm64-broker-compose.yaml
          cp dist/worker-linux-$GITHUB_SHA/install-worker.sh dist/release/install-worker-linux-x64.sh
          cp dist/worker-linux-$GITHUB_SHA/mars-orchestrator dist/release/mars-orchestrator-linux-x64
          cp dist/worker-linux-$GITHUB_SHA/mars-job-agent dist/release/mars-job-agent-linux-x64
          cp dist/worker-linux-$GITHUB_SHA/mars-worker-golden.qcow2 dist/release/mars-worker-golden.qcow2
          cp dist/worker-linux-$GITHUB_SHA/linux-broker-compose.yaml dist/release/linux-broker-compose.yaml; cp dist/worker-linux-$GITHUB_SHA/worker-domain.xml dist/release/worker-domain.xml
          cp dist/worker-windows-$GITHUB_SHA/install-worker.ps1 dist/release/install-worker-windows-x64.ps1; cp dist/worker-windows-$GITHUB_SHA/mars-worker-tray.ps1 dist/release/mars-worker-tray.ps1; cp dist/worker-windows-$GITHUB_SHA/MARS.ico dist/release/MARS.ico; cp dist/worker-windows-$GITHUB_SHA/mars-orchestrator.exe dist/release/mars-orchestrator-windows-x64.exe; cp dist/worker-windows-$GITHUB_SHA/mars-job-agent.exe dist/release/mars-job-agent-windows-x64.exe; cp dist/worker-windows-$GITHUB_SHA/mars-service-host.exe dist/release/mars-service-host.exe
          cp dist/worker-windows-$GITHUB_SHA/build-windows-container-image-local.ps1 dist/release/build-windows-container-image-local.ps1; cp dist/worker-windows-$GITHUB_SHA/verify-runtime.ps1 dist/release/verify-runtime.ps1; cp dist/worker-windows-$GITHUB_SHA/Containerfile dist/release/Containerfile; cp dist/worker-windows-$GITHUB_SHA/entrypoint.ps1 dist/release/entrypoint.ps1; cp dist/worker-windows-$GITHUB_SHA/mars-windows-runner.zip dist/release/mars-windows-runner.zip; cp dist/worker-windows-$GITHUB_SHA/mars-windows-git.zip dist/release/mars-windows-git.zip; cp dist/worker-windows-$GITHUB_SHA/mars-windows-vc-runtime.exe dist/release/mars-windows-vc-runtime.exe
          cp dist/worker-macos-$GITHUB_SHA/install-worker-macos.sh dist/release/install-worker-macos-arm64.sh; cp dist/worker-macos-$GITHUB_SHA/mars-orchestrator dist/release/mars-orchestrator-macos-arm64; cp dist/worker-macos-$GITHUB_SHA/mars-job-agent dist/release/mars-job-agent-macos-arm64; cp dist/worker-macos-$GITHUB_SHA/mars-status-item dist/release/mars-status-item-macos-arm64; cp dist/worker-macos-$GITHUB_SHA/MARS.icns dist/release/MARS.icns; cp dist/worker-macos-$GITHUB_SHA/prepare-macos-job-image.sh dist/release/prepare-macos-job-image.sh
      - uses: actions/upload-artifact@v4
        with: { name: "worker-release-assets-${{ github.sha }}", path: dist/release }
      - name: Create worker prerelease candidate
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail; gh release create "worker-v$WORKER_VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "Mars workers v$WORKER_VERSION" dist/release/*
      - name: Gate anonymous worker asset observability
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail; bun install --frozen-lockfile; bun run scripts/verify-worker-release.ts --manifest-url "${{ needs.validate-inputs.outputs.manifest_url }}" --contract-version "${{ needs.validate-inputs.outputs.contract_version }}"

  worker-binding:
    name: Validate and bind immutable worker release
    needs: [validate-inputs, worker-release]
    if: always() && needs.validate-inputs.result == 'success' && (inputs.worker_release_mode == 'reuse' || needs.worker-release.result == 'success')
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: read }
    outputs:
      manifest_url: "${{ steps.binding.outputs.manifest_url }}"
      worker_version: "${{ steps.binding.outputs.worker_version }}"
      contract_version: "${{ steps.binding.outputs.contract_version }}"
      worker_build_id: "${{ steps.binding.outputs.worker_build_id }}"
      broker_image: "${{ steps.binding.outputs.broker_image }}"
      broker_digest: "${{ steps.binding.outputs.broker_digest }}"
      arm_broker_image: "${{ steps.binding.outputs.arm_broker_image }}"
      arm_broker_digest: "${{ steps.binding.outputs.arm_broker_digest }}"
      arm_job_image: "${{ steps.binding.outputs.arm_job_image }}"
      arm_job_digest: "${{ steps.binding.outputs.arm_job_digest }}"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - name: Verify published worker assets and Linux broker
        id: binding
        env: { GH_TOKEN: "${{ github.token }}", BINDING_URL: "${{ needs.validate-inputs.outputs.manifest_url }}", BINDING_CONTRACT: "${{ needs.validate-inputs.outputs.contract_version }}" }
        run: |
          set -euo pipefail; bun install --frozen-lockfile
          result=$(bun run scripts/verify-worker-release.ts --manifest-url "$BINDING_URL" --contract-version "$BINDING_CONTRACT"); echo "$result"
          worker_version=$(jq -r .workerVersion <<<"$result"); build_id=$(jq -r .workerBuildId <<<"$result"); broker=$(jq -r .brokerImage <<<"$result"); digest=$(jq -r .brokerDigest <<<"$result"); arm_broker=$(jq -r .armBrokerImage <<<"$result"); arm_broker_digest=$(jq -r .armBrokerDigest <<<"$result"); arm_job=$(jq -r .armJobImage <<<"$result"); arm_job_digest=$(jq -r .armJobDigest <<<"$result")
          docker_config=$(mktemp -d); trap 'rm -rf "$docker_config"' EXIT; export DOCKER_CONFIG="$docker_config"
          docker buildx imagetools inspect "$broker" --format '{{.Manifest.Digest}}' >/dev/null; docker manifest inspect "$broker" >/dev/null
          docker buildx imagetools inspect "$arm_broker" --format '{{.Manifest.Digest}}' >/dev/null; docker manifest inspect "$arm_broker" >/dev/null
          docker buildx imagetools inspect "$arm_job" --format '{{.Manifest.Digest}}' >/dev/null; docker manifest inspect "$arm_job" >/dev/null
          printf 'manifest_url=%s\nworker_version=%s\ncontract_version=%s\nworker_build_id=%s\nbroker_image=%s\nbroker_digest=%s\narm_broker_image=%s\narm_broker_digest=%s\narm_job_image=%s\narm_job_digest=%s\n' "$BINDING_URL" "$worker_version" "$BINDING_CONTRACT" "$build_id" "$broker" "$digest" "$arm_broker" "$arm_broker_digest" "$arm_job" "$arm_job_digest" >> "$GITHUB_OUTPUT"

  unraid-images:
    name: Resolve immutable Unraid base images
    needs: validate-inputs
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    outputs:
      postgres_image: "${{ steps.images.outputs.postgres_image }}"
      postgres_digest: "${{ steps.images.outputs.postgres_digest }}"
      cloudflared_image: "${{ steps.images.outputs.cloudflared_image }}"
      cloudflared_digest: "${{ steps.images.outputs.cloudflared_digest }}"
    steps:
      - uses: docker/setup-buildx-action@v3
      - id: images
        run: |
          set -euo pipefail
          docker_config=$(mktemp -d); trap 'rm -rf "$docker_config"' EXIT; export DOCKER_CONFIG="$docker_config"
          postgres_image=postgres:17
          cloudflared_image=cloudflare/cloudflared:2026.9.1
          docker pull --platform linux/amd64 "$postgres_image" >/dev/null
          docker pull --platform linux/amd64 "$cloudflared_image" >/dev/null
          postgres_digest=$(docker buildx imagetools inspect "$postgres_image" --format '{{.Manifest.Digest}}')
          cloudflared_digest=$(docker buildx imagetools inspect "$cloudflared_image" --format '{{.Manifest.Digest}}')
          [[ "$postgres_digest" =~ ^sha256:[0-9a-f]{64}$ && "$cloudflared_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'postgres_image=%s\npostgres_digest=%s\ncloudflared_image=%s\ncloudflared_digest=%s\n' "$postgres_image" "$postgres_digest" "$cloudflared_image" "$cloudflared_digest" >> "$GITHUB_OUTPUT"
  control-plane:
    name: Build control-plane candidate
    needs: [validate-inputs, worker-binding]
    if: needs.worker-binding.result == 'success'
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    outputs: { digest: "${{ steps.image.outputs.digest }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - id: image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --push -f deploy/control-plane/Dockerfile --build-arg MARS_BUILD_ID="$BUILD_ID" --build-arg MARS_WORKER_RELEASE_MANIFEST_URL="${{ needs.worker-binding.outputs.manifest_url }}" --build-arg MARS_WORKER_CONTRACT_VERSION="${{ needs.worker-binding.outputs.contract_version }}" -t "$APP_IMAGE:v$APP_VERSION" -t "$APP_IMAGE:$APP_CANDIDATE_TAG" .
          digest=$(docker buildx imagetools inspect "$APP_IMAGE:v$APP_VERSION" --format '{{.Manifest.Digest}}'); [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1; echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify slim immutable image
        env: { DIGEST: "${{ steps.image.outputs.digest }}" }
        run: docker run --rm --entrypoint /bin/sh "$APP_IMAGE@$DIGEST" -c 'test -f /app/index.js && test -f /app/web/index.html && test -f /app/migrations/meta/_journal.json && test ! -e /app/workers'

  candidate-compose-smoke:
    name: Smoke published control-plane digest
    needs: [validate-inputs, worker-binding, control-plane]
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run published-image Compose and ingress smoke
        env:
          MARS_CONTROL_PLANE_IMAGE: "${{ env.APP_IMAGE }}@${{ needs.control-plane.outputs.digest }}"
          EXPECTED_BUILD_SHA: "${{ env.BUILD_ID }}"
        run: bash tests/control-plane-compose-smoke.sh
  upgrade-recovery:
    name: Prove upgrade, rollback, and clean restore
    needs: [validate-inputs, worker-binding, control-plane, candidate-compose-smoke]
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - uses: docker/setup-buildx-action@v3
      - name: Resolve previous immutable release digest
        id: previous
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          previous_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft --jq '[.[] | select(.isDraft == false and (.tagName | startswith("v")))][0].tagName // empty')
          if [[ -z "$previous_tag" ]]; then echo 'No previous published app release; upgrade/rollback proof is not applicable.'; exit 0; fi
          mkdir -p previous; gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern mars-release-metadata.txt --dir previous
          previous_digest=$(awk -F= '$1 == "app_digest" { print $2 }' previous/mars-release-metadata.txt)
          [[ "$previous_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'previous release metadata has no immutable app digest' >&2; exit 1; }
          echo "image=$APP_IMAGE@$previous_digest" >> "$GITHUB_OUTPUT"
      - name: Run coordinated upgrade and recovery proof
        if: steps.previous.outputs.image != ''
        env:
          PREVIOUS_IMAGE: "${{ steps.previous.outputs.image }}"
          CANDIDATE_IMAGE: "${{ env.APP_IMAGE }}@${{ needs.control-plane.outputs.digest }}"
          EXPECTED_BUILD_SHA: "${{ env.BUILD_ID }}"
        run: bun install --frozen-lockfile && bash tests/control-plane-upgrade-recovery-smoke.sh

  candidate-observability:
    name: Gate anonymous GHCR candidate manifests
    needs: [worker-binding, control-plane]
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: read }
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Pull and inspect candidate manifests anonymously
        run: |
          set -euo pipefail; docker_config=$(mktemp -d); trap 'rm -rf "$docker_config"' EXIT; export DOCKER_CONFIG="$docker_config"
          docker buildx imagetools inspect "$APP_IMAGE:$APP_CANDIDATE_TAG" --format '{{.Manifest.Digest}}'; docker manifest inspect "$APP_IMAGE:$APP_CANDIDATE_TAG" >/dev/null
          if [[ "$WORKER_MODE" == build ]]; then docker buildx imagetools inspect "$BROKER_IMAGE:$BROKER_CANDIDATE_TAG" --format '{{.Manifest.Digest}}'; docker manifest inspect "$BROKER_IMAGE:$BROKER_CANDIDATE_TAG" >/dev/null; fi

  release-evidence:
    name: Create draft release and publish evidence
    needs: [validate-inputs, worker-binding, unraid-images, control-plane, candidate-compose-smoke, upgrade-recovery, candidate-observability]
    runs-on: ubuntu-24.04
    permissions: { contents: write, packages: read, id-token: write, attestations: write }
    outputs: { metadata: "${{ steps.metadata.outputs.path }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: anchore/sbom-action@v0
        with: { image: "${{ env.APP_IMAGE }}@${{ needs.control-plane.outputs.digest }}", artifact-name: control-plane-sbom.spdx.json, output-file: control-plane-sbom.spdx.json, format: spdx-json }
      - uses: actions/attest@v4
        id: provenance
        with: { subject-name: ghcr.io/snazzie/mars/control-plane, subject-digest: "${{ needs.control-plane.outputs.digest }}", push-to-registry: true, create-storage-record: false }
      - uses: actions/attest@v4
        id: sbom-attestation
        with: { subject-name: ghcr.io/snazzie/mars/control-plane, subject-digest: "${{ needs.control-plane.outputs.digest }}", sbom-path: control-plane-sbom.spdx.json, push-to-registry: true, create-storage-record: false }
      - name: Render immutable Unraid release assets
        env:
          APP_DIGEST: "${{ needs.control-plane.outputs.digest }}"
          POSTGRES_IMAGE: "${{ needs.unraid-images.outputs.postgres_image }}"
          POSTGRES_DIGEST: "${{ needs.unraid-images.outputs.postgres_digest }}"
          CLOUDFLARED_IMAGE: "${{ needs.unraid-images.outputs.cloudflared_image }}"
          CLOUDFLARED_DIGEST: "${{ needs.unraid-images.outputs.cloudflared_digest }}"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run scripts/render-unraid-release.ts \
            --app-version "$APP_VERSION" \
            --app-image "$APP_IMAGE@$APP_DIGEST" \
            --postgres-image "${POSTGRES_IMAGE%@*}@$POSTGRES_DIGEST" \
            --cloudflared-image "${CLOUDFLARED_IMAGE%@*}@$CLOUDFLARED_DIGEST" \
            --out-dir dist/unraid
          for asset in dist/unraid/*.xml; do xmllint --noout "$asset"; done
          test "$(grep -c "<Repository>$APP_IMAGE@$APP_DIGEST</Repository>" dist/unraid/mars-control-plane-v"$APP_VERSION".xml)" = 1
          test "$(grep -c "<Repository>${POSTGRES_IMAGE%@*}@$POSTGRES_DIGEST</Repository>" dist/unraid/mars-postgres-v"$APP_VERSION".xml)" = 1
          test "$(grep -c "<Repository>${CLOUDFLARED_IMAGE%@*}@$CLOUDFLARED_DIGEST</Repository>" dist/unraid/mars-cloudflared-v"$APP_VERSION".xml)" = 1
      - name: Create draft app release and upload evidence
        id: metadata
        env: { GH_TOKEN: "${{ github.token }}", APP_DIGEST: "${{ needs.control-plane.outputs.digest }}", SBOM_ATTESTATION_URL: "${{ steps.sbom-attestation.outputs.attestation-url }}", PROVENANCE_ATTESTATION_URL: "${{ steps.provenance.outputs.attestation-url }}" }
        run: |
          set -euo pipefail; sbom_sha256=$(sha256sum control-plane-sbom.spdx.json | cut -d' ' -f1); sbom_url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$APP_VERSION/control-plane-sbom.spdx.json"
          printf 'app_version=%s\nbuild_sha=%s\napp_image=%s\napp_digest=%s\npostgres_image=%s\npostgres_digest=%s\ncloudflared_image=%s\ncloudflared_digest=%s\nunraid_control_plane_asset=mars-control-plane-v%s.xml\nunraid_postgres_asset=mars-postgres-v%s.xml\nunraid_cloudflared_asset=mars-cloudflared-v%s.xml\nworker_version=%s\nworker_manifest_url=%s\nworker_build_id=%s\ncontract_version=%s\nbroker_image=%s\nbroker_digest=%s\nsbom_url=%s\nsbom_sha256=%s\nprovenance_attestation_url=%s\nsbom_attestation_url=%s\n' "$APP_VERSION" "$GITHUB_SHA" "$APP_IMAGE" "$APP_DIGEST" "${{ needs.unraid-images.outputs.postgres_image }}" "${{ needs.unraid-images.outputs.postgres_digest }}" "${{ needs.unraid-images.outputs.cloudflared_image }}" "${{ needs.unraid-images.outputs.cloudflared_digest }}" "$APP_VERSION" "$APP_VERSION" "$APP_VERSION" "${{ needs.worker-binding.outputs.worker_version }}" "${{ needs.worker-binding.outputs.manifest_url }}" "${{ needs.worker-binding.outputs.worker_build_id }}" "${{ needs.worker-binding.outputs.contract_version }}" "${{ needs.worker-binding.outputs.broker_image }}" "${{ needs.worker-binding.outputs.broker_digest }}" "$sbom_url" "$sbom_sha256" "$PROVENANCE_ATTESTATION_URL" "$SBOM_ATTESTATION_URL" > mars-release-metadata.txt
          for field in app_digest postgres_digest cloudflared_digest; do grep -Eq "^${field}=.+$" mars-release-metadata.txt; done
          grep -F "<Repository>${APP_IMAGE}@${APP_DIGEST}</Repository>" "dist/unraid/mars-control-plane-v${APP_VERSION}.xml"
          grep -F "<Repository>${{ needs.unraid-images.outputs.postgres_image }}@${{ needs.unraid-images.outputs.postgres_digest }}</Repository>" "dist/unraid/mars-postgres-v${APP_VERSION}.xml"
          grep -F "<Repository>${{ needs.unraid-images.outputs.cloudflared_image }}@${{ needs.unraid-images.outputs.cloudflared_digest }}</Repository>" "dist/unraid/mars-cloudflared-v${APP_VERSION}.xml"
          gh release create "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --latest=false --title "Mars v$APP_VERSION" --generate-notes
          gh release upload "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" mars-release-metadata.txt control-plane-sbom.spdx.json dist/unraid/*.xml
          echo 'path=mars-release-metadata.txt' >> "$GITHUB_OUTPUT"
      - name: Verify published digest and attestations before staging
        env:
          GH_TOKEN: "${{ github.token }}"
          APP_DIGEST: "${{ needs.control-plane.outputs.digest }}"
          PROVENANCE_URL: "${{ steps.provenance.outputs.attestation-url }}"
          SBOM_ATTESTATION_URL: "${{ steps.sbom-attestation.outputs.attestation-url }}"
        run: |
          set -euo pipefail
          [[ -n "$PROVENANCE_URL" && -n "$SBOM_ATTESTATION_URL" ]] || { echo 'attestation URLs are required release evidence' >&2; exit 1; }
          test "$(sha256sum control-plane-sbom.spdx.json | cut -d' ' -f1)" = "$(awk -F= '$1 == \"sbom_sha256\" { print $2 }' mars-release-metadata.txt)"
          docker pull --platform linux/amd64 "$APP_IMAGE@$APP_DIGEST"
          gh attestation verify "oci://$APP_IMAGE@$APP_DIGEST" -R "$GITHUB_REPOSITORY"
          gh attestation verify "oci://$APP_IMAGE@$APP_DIGEST" -R "$GITHUB_REPOSITORY" --predicate-type https://spdx.dev/Document/v2.3

  staging:
    name: Protected control-plane staging approval
    needs: [release-evidence]
    environment: control-plane-staging
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: read }
    steps:
      - run: echo 'External DNS/TLS, GitHub App, webhook, WebSocket, restart, upgrade, rollback, and restore observations are required before approval.'

  promote:
    name: Promote verified Mars release
    needs: [validate-inputs, worker-binding, control-plane, release-evidence, staging]
    if: needs.staging.result == 'success'
    runs-on: ubuntu-24.04
    permissions: { contents: write, packages: write }
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - name: Promote exact candidate digest
        env: { GH_TOKEN: "${{ github.token }}", APP_DIGEST: "${{ needs.control-plane.outputs.digest }}" }
        run: |
          previous_app_digest=$(docker buildx imagetools inspect "$APP_IMAGE:latest" --format '{{.Manifest.Digest}}' 2>&1) || { echo 'unable to determine existing control-plane latest digest (MANIFEST_UNKNOWN); tag does not exist; aborting before promotion' >&2; exit 1; }
          previous_broker_digest=''; if [[ "$WORKER_MODE" == build ]]; then previous_broker_digest=$(docker buildx imagetools inspect "$BROKER_IMAGE:latest" --format '{{.Manifest.Digest}}' 2>&1) || { echo 'unable to determine existing broker latest digest (MANIFEST_UNKNOWN); tag does not exist; aborting before promotion' >&2; exit 1; }; fi
          rollback_failed=0; rollback(){ status=$?; set +e; docker buildx imagetools create --tag "$APP_IMAGE:latest" "$APP_IMAGE@$previous_app_digest" || rollback_failed=1; if [[ "$WORKER_MODE" == build ]]; then docker buildx imagetools create --tag "$BROKER_IMAGE:latest" "$BROKER_IMAGE@$previous_broker_digest" || rollback_failed=1; fi; gh release edit "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" --draft=true --latest=false || rollback_failed=1; ((rollback_failed==0)) || echo 'release rollback did not fully restore state' >&2; exit "$status"; }; trap rollback ERR
          if [[ "$WORKER_MODE" == build ]]; then
            docker buildx imagetools create --tag "$BROKER_IMAGE:latest" "$BROKER_IMAGE@${{ needs.worker-binding.outputs.broker_digest }}"
            promoted_broker_digest=$(docker buildx imagetools inspect "$BROKER_IMAGE:latest" --format '{{.Manifest.Digest}}')
            [[ "$promoted_broker_digest" == "${{ needs.worker-binding.outputs.broker_digest }}" ]] || { echo 'linux broker latest promotion changed digest' >&2; exit 1; }
          fi
          docker buildx imagetools create --tag "$APP_IMAGE:latest" "$APP_IMAGE@$APP_DIGEST"
          [[ "$(docker buildx imagetools inspect "$APP_IMAGE:latest" --format '{{.Manifest.Digest}}')" == "$APP_DIGEST" ]] || { echo 'control-plane latest promotion changed digest' >&2; exit 1; }
          gh release edit "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest=true
          if [[ "$WORKER_MODE" == build ]]; then gh release edit "worker-v$WORKER_VERSION" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest=false; fi
          trap - ERR
