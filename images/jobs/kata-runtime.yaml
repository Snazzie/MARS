apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: mars-kata
handler: kata-qemu-runtime-rs
overhead:
  podFixed:
    cpu: 250m
    memory: 256Mi
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mars-require-kata
spec:
  validationFailureAction: Enforce
  rules:
    - name: require-mars-kata
      match: {any: [{resources: {kinds: [Pod], namespaces: [mars-jobs]}}]}
      validate:
        message: Mars jobs must use mars-kata
        pattern: {spec: {runtimeClassName: mars-kata}}
